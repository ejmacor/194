  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ily: 'Sora';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ad6d9c90-944f-4606-b539-e7a4356140d8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f456f93e-7148-4af5-bc0d-6541efc8a989\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"ad6d9c90-944f-4606-b539-e7a4356140d8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --paper:#F5F3EF; --surface:#FBFAF8; --ink:#14140F; --secondary:#6B675F;\n  --muted:#A9A49B; --line:#DCD6CB; --stamp:#8A5A4A; --error:#A33A2B;\n  --bar:57px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--paper);color:var(--ink);font-family:Sora,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}\na{color:var(--stamp);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}\na:hover{color:var(--ink)}\nbutton{font-family:inherit;margin:0}\n:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}\n[hidden]{display:none !important}\n.serif{font-family:\"Instrument Serif\",Georgia,serif;font-weight:400}\n.caps{text-transform:uppercase;letter-spacing:.14em}\n.num{font-variant-numeric:tabular-nums}\n.wrap{max-width:1240px;margin:0 auto;padding:0 28px}\n\n/* ── gate ───────────────────────────── */\n#gate{min-height:100vh;display:grid;place-items:center;padding:40px 24px}\n.gate-in{width:100%;max-width:372px}\n.gate-mark{font-family:\"Instrument Serif\",Georgia,serif;font-size:52px;line-height:.9;letter-spacing:-.01em}\n.gate-unit{margin-top:10px;font-size:10.5px;font-weight:500;color:var(--secondary);text-transform:uppercase;letter-spacing:.22em}\n.gate-hr{height:1px;background:var(--line);margin:26px 0 24px}\n.gate-lede{font-size:13.5px;color:var(--secondary);text-wrap:pretty}\n.field{margin-top:26px}\n.field label{display:block;font-size:9.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}\n.field input{width:100%;height:46px;margin-top:4px;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);font:400 16px Sora,sans-serif;padding:0}\n.field input::placeholder{color:var(--muted)}\n.field input:focus{outline:0;border-bottom-width:2px;margin-bottom:-1px}\n.btn{border:1px solid transparent;border-radius:2px;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}\n.btn-solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n.btn-solid:hover{background:#000}\n.btn-solid:disabled{opacity:.45;cursor:default}\n.gate-submit{width:100%;height:48px;margin-top:22px}\n.gate-err{margin-top:14px;font-size:11px;font-weight:500;color:var(--error);text-transform:uppercase;letter-spacing:.12em;min-height:14px}\n.gate-note{margin-top:18px;font-size:12.5px;color:var(--secondary)}\n.gate-links{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}\n.link-btn{background:none;border:0;padding:0;font-size:12.5px;color:var(--stamp);text-decoration:underline;text-underline-offset:3px;cursor:pointer}\n.link-btn:hover{color:var(--ink)}\n.gate-foot{margin-top:44px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}\n.sent-h{font-family:\"Instrument Serif\",Georgia,serif;font-size:30px;line-height:1.1}\n.mono{font-variant-numeric:tabular-nums;letter-spacing:.04em}\n\n/* ── header ─────────────────────────── */\n.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}\n.bar-in{height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:20px}\n.brand{display:flex;align-items:center;gap:14px}\n.brand .mk{font-family:\"Instrument Serif\",Georgia,serif;font-size:25px;line-height:1}\n.brand .vr{width:1px;height:18px;background:var(--line)}\n.brand .unit{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.24em}\n.officer{display:flex;align-items:center;gap:6px}\n.officer .em{font-size:10px;font-weight:500;color:var(--secondary);text-transform:uppercase;letter-spacing:.14em;margin-right:10px}\n.tbtn{height:34px;padding:0 12px;background:none;border:1px solid transparent;border-radius:2px;color:var(--secondary);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;cursor:pointer}\n.tbtn:hover{color:var(--ink);border-color:var(--line);background:var(--surface)}\n.tbtn:disabled{color:var(--muted);cursor:default;border-color:transparent;background:none}\n\n/* ── stats ──────────────────────────── */\n.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}\n.stat{padding:24px 0 22px}\n.stat+.stat{border-left:1px solid var(--line);padding-left:26px}\n.stat .v{font-family:\"Instrument Serif\",Georgia,serif;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}\n.stat .k{margin-top:8px;font-size:9.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.2em}\n\n/* ── toolbar ────────────────────────── */\n.toolbar{position:sticky;top:var(--bar);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}\n.toolbar-in{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;height:52px}\n.tabs{display:flex;gap:34px}\n.tab{display:flex;align-items:center;gap:8px;height:52px;padding:0;margin:0;background:none;border:0;border-bottom:2px solid transparent;color:var(--secondary);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;cursor:pointer}\n.tab:hover{color:var(--ink)}\n.tab .c{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.04em}\n.tab[aria-selected=\"true\"]{color:var(--ink);border-bottom-color:var(--ink)}\n.tab[aria-selected=\"true\"] .c{color:var(--ink)}\n.search{display:flex;align-items:center;gap:10px;width:320px;height:36px;margin-bottom:8px;border-bottom:1px solid var(--line)}\n.search:focus-within{border-bottom-color:var(--ink)}\n.search input{flex:1;height:100%;border:0;background:transparent;color:var(--ink);font:400 13px Sora,sans-serif}\n.search input:focus{outline:0}\n.search input::placeholder{color:var(--muted)}\n.search .kbd{font-size:9.5px;color:var(--muted);letter-spacing:.1em}\n\n/* ── queue ──────────────────────────── */\n.queue{list-style:none;margin:0;padding:0;background:var(--surface);border-bottom:1px solid var(--line)}\n.queue.busy{opacity:.4}\n.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:0 18px;padding:15px 28px;border-bottom:1px solid var(--line)}\n.row:last-child{border-bottom:0}\n.row:hover{background:#fff}\n.flag{font-size:21px;line-height:1}\n.name{font-size:16px;font-weight:500;letter-spacing:-.005em}\n.meta{margin-top:2px;font-size:12.5px;color:var(--secondary)}\n.meta .sep{color:var(--line);margin:0 6px}\n.sub{margin-top:5px;display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-variant-numeric:tabular-nums}\n.sub .em{text-transform:none;letter-spacing:.03em;font-size:11px}\n.sub .vr{width:1px;height:9px;background:var(--line)}\n.acts{display:flex;align-items:center;gap:8px}\n.act{height:40px;padding:0 18px;border-radius:2px;border:1px solid;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;cursor:pointer}\n.act-ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}\n.act-ok:hover{background:#000}\n.act-no{background:transparent;color:var(--error);border-color:color-mix(in oklab,var(--error) 32%,var(--line))}\n.act-no:hover{background:color-mix(in oklab,var(--error) 7%,transparent);border-color:var(--error)}\n.act-undo{background:transparent;color:var(--secondary);border-color:var(--line)}\n.act-undo:hover{color:var(--ink);border-color:var(--secondary)}\n.pill{position:relative;padding:8px 13px;border:1.5px solid currentColor;border-radius:2px;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;transform:rotate(-2.5deg)}\n.pill::after{content:\"\";position:absolute;inset:2.5px;border:1px solid currentColor;opacity:.4;border-radius:1px}\n.pill-ok{color:var(--ink)}\n.pill-no{color:var(--error)}\n.pill-pending{color:var(--stamp)}\n.empty{background:var(--surface);border-bottom:1px solid var(--line);padding:74px 28px;text-align:center}\n.empty h3{margin:0;font-family:\"Instrument Serif\",Georgia,serif;font-weight:400;font-size:26px}\n.empty p{margin:8px 0 0;font-size:12.5px;color:var(--secondary)}\n.tail{padding:16px 28px 60px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;font-variant-numeric:tabular-nums}\n\n/* ── toast ──────────────────────────── */\n.toast{position:fixed;left:28px;bottom:28px;z-index:60;display:flex;align-items:center;gap:12px;max-width:400px;padding:14px 18px;background:var(--surface);border:1px solid var(--ink);border-radius:2px;box-shadow:0 10px 28px -18px rgba(20,20,15,.5);font-size:12.5px;transform:translateX(calc(-100% - 40px));opacity:0;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .2s}\n.toast.show{transform:translateX(0);opacity:1}\n.toast .tag{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}\n.toast.err{border-color:var(--error);color:var(--error)}\n.toast.err .tag{color:var(--error)}\n@media (max-width:900px){\n  .stats{grid-template-columns:repeat(2,1fr)}\n  .stat:nth-child(3){border-left:0;padding-left:0}\n  .toolbar-in{height:auto;flex-direction:column;align-items:stretch;padding-bottom:10px}\n  .search{width:100%}\n  .row{grid-template-columns:26px 1fr;padding:14px 20px}\n  .acts{grid-column:2;margin-top:10px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<main id=\"gate\">\n  <div class=\"gate-in\">\n    <div class=\"gate-mark\">194<\u002Fdiv>\n    <div class=\"gate-unit\">Border Control<\u002Fdiv>\n    <div class=\"gate-hr\"><\u002Fdiv>\n\n    <div id=\"gate-idle\">\n      <p class=\"gate-lede\">Officer access. Enter your email and we'll send a one-time link.<\u002Fp>\n      <form class=\"field\" id=\"gate-form\" novalidate=\"\">\n        <label for=\"email\">Officer email<\u002Flabel>\n        <input id=\"email\" type=\"email\" name=\"email\" autocomplete=\"email\" placeholder=\"you@194.club\" spellcheck=\"false\">\n        <button class=\"btn btn-solid gate-submit\" type=\"submit\" id=\"send\">Send sign-in link<\u002Fbutton>\n      <\u002Fform>\n      <div class=\"gate-err\" id=\"gate-error\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"gate-sent\" hidden=\"\">\n      <h1 class=\"sent-h\">Link sent<\u002Fh1>\n      <p class=\"gate-note\">Check <span class=\"mono\" id=\"sent-to\"><\u002Fspan>. The link expires in 15 minutes and works once. Opening it now…<\u002Fp>\n      <div class=\"gate-links\">\n        <button class=\"link-btn\" id=\"open-link\" type=\"button\">Open the link →<\u002Fbutton>\n        <button class=\"link-btn\" id=\"back\" type=\"button\">← Use a different email<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"gate-foot\">Staff only · No public registration<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<div id=\"app\" hidden=\"\">\n  <header class=\"bar\">\n    <div class=\"wrap bar-in\">\n      <div class=\"brand\"><span class=\"mk\">194<\u002Fspan><span class=\"vr\"><\u002Fspan><span class=\"unit\">Border Control<\u002Fspan><\u002Fdiv>\n      <div class=\"officer\">\n        <span class=\"em\" id=\"officer-email\">—<\u002Fspan>\n        <button class=\"tbtn\" id=\"refresh\" type=\"button\">Refresh<\u002Fbutton>\n        <button class=\"tbtn\" id=\"signout\" type=\"button\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"wrap\">\n    <section class=\"stats\">\n      <div class=\"stat\"><div class=\"v\" id=\"s-total\">0<\u002Fdiv><div class=\"k\">Applications<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"v\" id=\"s-pending\">0<\u002Fdiv><div class=\"k\">Pending review<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"v\" id=\"s-rate\">—<\u002Fdiv><div class=\"k\">Approval rate<\u002Fdiv><\u002Fdiv>\n      <div class=\"stat\"><div class=\"v\" id=\"s-countries\">0<\u002Fdiv><div class=\"k\">Countries<\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div class=\"toolbar\">\n    <div class=\"wrap toolbar-in\">\n      <div class=\"tabs\" role=\"tablist\" id=\"tabs\">\n        <button class=\"tab\" role=\"tab\" data-tab=\"pending\" aria-selected=\"true\">Pending <span class=\"c\" id=\"c-pending\">0<\u002Fspan><\u002Fbutton>\n        <button class=\"tab\" role=\"tab\" data-tab=\"approved\" aria-selected=\"false\">Approved <span class=\"c\" id=\"c-approved\">0<\u002Fspan><\u002Fbutton>\n        <button class=\"tab\" role=\"tab\" data-tab=\"rejected\" aria-selected=\"false\">Rejected <span class=\"c\" id=\"c-rejected\">0<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"search\">\n        <input id=\"q\" type=\"search\" placeholder=\"Search name, country, city, handle\" spellcheck=\"false\" aria-label=\"Search the queue\">\n        <span class=\"kbd\">/<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"wrap\">\n    <div id=\"queue-box\"><\u002Fdiv>\n    <div class=\"tail\" id=\"tail\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><span class=\"tag\" id=\"toast-tag\">Logged<\u002Fspan><span id=\"toast-msg\"><\u002Fspan><\u002Fdiv>\n\n<script>\nconst KEY='bc194:ledger:officer';\nconst MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\nconst fdate=iso=>{const[y,m,d]=iso.split('-');return d+' '+MON[+m-1]+' '+y};\n\nconst PEOPLE=[\n {f:'🇧🇷',n:'Marina Albuquerque',c:'Brazil',city:'Los Angeles',ig:'marinaalb',e:'marina.albuquerque@gmail.com',d:'2026-08-05',s:'pending'},\n {f:'🇳🇬',n:'Chidi Okonkwo',c:'Nigeria',city:'Houston',ig:'chidi.okonkwo',e:'c.okonkwo@proton.me',d:'2026-08-05',s:'pending'},\n {f:'🇰🇷',n:'Soo-ah Lim',c:'South Korea',city:'New York',ig:'sooah.lim',e:'sooah@limstudio.co',d:'2026-08-04',s:'pending'},\n {f:'🇫🇷',n:'Élodie Marchand',c:'France',city:'Miami',ig:'elodiemrchnd',e:'elodie.marchand@icloud.com',d:'2026-08-04',s:'pending'},\n {f:'🇱🇧',n:'Karim Haddad',c:'Lebanon',city:'Chicago',ig:'karimhddd',e:'karim@haddad.works',d:'2026-08-03',s:'pending'},\n {f:'🇸🇪',n:'Agnes Wikström',c:'Sweden',city:'Brooklyn',ig:'agnes.wkstrm',e:'agnes.wikstrom@gmail.com',d:'2026-08-03',s:'pending'},\n {f:'🇮🇳',n:'Priya Ramanathan',c:'India',city:'Austin',ig:'priyaram',e:'priya.ramanathan@gmail.com',d:'2026-08-02',s:'pending'},\n {f:'🇦🇷',n:'Tomás Ferreyra',c:'Argentina',city:'Miami',ig:'tomasferreyra',e:'tomas@ferreyra.tv',d:'2026-08-02',s:'pending'},\n {f:'🇯🇵',n:'Haruki Nakamura',c:'Japan',city:'San Francisco',ig:'haruki.nkmr',e:'haruki@nakamura.jp',d:'2026-08-01',s:'pending'},\n {f:'🇿🇦',n:'Thandiwe Mokoena',c:'South Africa',city:'Atlanta',ig:'thandiwe.mk',e:'thandiwe.mokoena@gmail.com',d:'2026-07-31',s:'pending'},\n {f:'🇩🇪',n:'Lena Vogt',c:'Germany',city:'New York',ig:'lenavogt',e:'lena.vogt@gmail.com',d:'2026-07-29',s:'approved'},\n {f:'🇲🇽',n:'Diego Salcedo',c:'Mexico',city:'San Diego',ig:'diegoslcd',e:'diego@salcedo.mx',d:'2026-07-28',s:'approved'},\n {f:'🇮🇹',n:'Giulia Bertelli',c:'Italy',city:'Brooklyn',ig:'giulia.brtl',e:'giulia.bertelli@gmail.com',d:'2026-07-27',s:'approved'},\n {f:'🇹🇷',n:'Emre Yıldız',c:'Turkey',city:'Boston',ig:'emre.yldz',e:'emre@yildiz.co',d:'2026-07-25',s:'approved'},\n {f:'🇬🇧',n:'Oliver Bexley',c:'United Kingdom',city:'Nashville',ig:'obexley',e:'oliver.bexley@gmail.com',d:'2026-07-24',s:'rejected'},\n {f:'🇵🇭',n:'Andrea Bituin',c:'Philippines',city:'Las Vegas',ig:'andrea.bituin',e:'andrea@bituin.ph',d:'2026-07-22',s:'rejected'}\n].map((p,i)=>Object.assign({id:'a'+i},p));\n\nconst EMPTY={\n pending:['Queue clear','Nothing waiting on a decision. New applications land here.'],\n approved:['No approvals yet','Approved members will be listed here with their stamp.'],\n rejected:['No rejections','Nothing has been turned away.']\n};\nconst $=s=>document.querySelector(s);\nlet tab='pending',q='',lastRefresh=0,toastTimer,autoOpen;\n\n/* ── gate ─────────────────────────────────────── */\nfunction showGate(){clearTimeout(autoOpen);$('#app').hidden=true;$('#gate').hidden=false;$('#gate-idle').hidden=false;$('#gate-sent').hidden=true;$('#gate-error').textContent='';}\nfunction signIn(email){\n  try{localStorage.setItem(KEY,email)}catch(e){}\n  $('#gate').hidden=true;$('#app').hidden=false;\n  $('#officer-email').textContent=email;\n  render();toast('Signed in as '+email,'Session');\n}\n$('#gate-form').addEventListener('submit',e=>{\n  e.preventDefault();\n  const v=$('#email').value.trim();\n  const err=$('#gate-error');\n  if(!/^[^\\s@]+@[^\\s@]+\\.[a-z]{2,}$/i.test(v)){err.textContent='That email doesn\\u2019t look right.';return}\n  err.textContent='';\n  $('#send').disabled=true;$('#send').textContent='Sending…';\n  setTimeout(()=>{\n    $('#send').disabled=false;$('#send').textContent='Send sign-in link';\n    $('#gate-idle').hidden=true;$('#gate-sent').hidden=false;\n    $('#sent-to').textContent=v;\n    clearTimeout(autoOpen);\n    autoOpen=setTimeout(()=>{if(!$('#gate-sent').hidden)signIn(v.toLowerCase())},1500);\n  },480);\n});\n$('#open-link').addEventListener('click',()=>signIn($('#email').value.trim().toLowerCase()));\n$('#back').addEventListener('click',()=>{showGate();$('#email').focus()});\n$('#signout').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}showGate();$('#email').value='';});\n\n/* ── data ─────────────────────────────────────── */\nconst counts=()=>({\n  pending:PEOPLE.filter(p=>p.s==='pending').length,\n  approved:PEOPLE.filter(p=>p.s==='approved').length,\n  rejected:PEOPLE.filter(p=>p.s==='rejected').length\n});\nfunction visible(){\n  const t=q.trim().toLowerCase();\n  return PEOPLE.filter(p=>p.s===tab).filter(p=>!t||[p.n,p.c,p.city,p.ig,p.e].join(' ').toLowerCase().includes(t));\n}\nfunction render(){\n  const c=counts(),decided=c.approved+c.rejected;\n  $('#s-total').textContent=PEOPLE.length;\n  $('#s-pending').textContent=c.pending;\n  $('#s-rate').textContent=decided?Math.round(c.approved/decided*100)+'%':'—';\n  $('#s-countries').textContent=new Set(PEOPLE.map(p=>p.c)).size;\n  $('#c-pending').textContent=c.pending;$('#c-approved').textContent=c.approved;$('#c-rejected').textContent=c.rejected;\n  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));\n\n  const list=visible(),box=$('#queue-box');\n  box.innerHTML='';\n  if(!list.length){\n    const e=document.createElement('div');e.className='empty';\n    const h=document.createElement('h3'),p=document.createElement('p');\n    if(q.trim()){h.textContent='No match';p.textContent='Nothing in '+tab+' matches “'+q.trim()+'”.'}\n    else{h.textContent=EMPTY[tab][0];p.textContent=EMPTY[tab][1]}\n    e.append(h,p);box.append(e);\n    $('#tail').textContent='';\n    return;\n  }\n  const ul=document.createElement('ul');ul.className='queue';ul.id='queue';\n  list.forEach(p=>ul.append(rowEl(p)));box.append(ul);\n  $('#tail').textContent='End of queue · '+list.length+' of '+PEOPLE.length+' applications';\n}\nfunction rowEl(p){\n  const li=document.createElement('li');li.className='row';\n  const flag=document.createElement('span');flag.className='flag';flag.textContent=p.f;\n  const who=document.createElement('div');\n  const name=document.createElement('div');name.className='name';name.textContent=p.n;\n  const meta=document.createElement('div');meta.className='meta';\n  meta.append(p.c);meta.append(sep(),p.city,sep());\n  const ig=document.createElement('a');ig.href='https://instagram.com/'+p.ig;ig.target='_blank';ig.rel='noreferrer noopener';ig.textContent='@'+p.ig;\n  meta.append(ig);\n  const sub=document.createElement('div');sub.className='sub';\n  const em=document.createElement('span');em.className='em';em.textContent=p.e;\n  const vr=document.createElement('span');vr.className='vr';\n  const ap=document.createElement('span');ap.textContent='Applied '+fdate(p.d);\n  sub.append(em,vr,ap);\n  who.append(name,meta,sub);\n  const acts=document.createElement('div');acts.className='acts';\n  if(p.s==='pending'){\n    acts.append(btn('Approve','act act-ok',()=>decide(p,'approved')),btn('Reject','act act-no',()=>decide(p,'rejected')));\n  }else{\n    const pill=document.createElement('span');\n    pill.className='pill '+(p.s==='approved'?'pill-ok':'pill-no');\n    pill.textContent=p.s==='approved'?'Approved':'Rejected';\n    acts.append(pill,btn('Undo','act act-undo',()=>undo(p)));\n  }\n  li.append(flag,who,acts);return li;\n}\nconst sep=()=>{const s=document.createElement('span');s.className='sep';s.textContent='·';return s};\nfunction btn(label,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b}\n\nfunction decide(p,status){\n  p.s=status;render();\n  toast(p.n+' '+(status==='approved'?'approved. Welcome email queued.':'rejected. No email sent.'),status==='approved'?'Approved':'Rejected');\n}\nfunction undo(p){p.s='pending';render();toast(p.n+' moved back to pending.','Undone')}\n\nfunction toast(msg,tag,isErr){\n  const t=$('#toast');\n  $('#toast-msg').textContent=msg;$('#toast-tag').textContent=tag||'Logged';\n  t.classList.toggle('err',!!isErr);t.classList.add('show');\n  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);\n}\n\n/* ── controls ─────────────────────────────────── */\n$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.tab;render()});\n$('#q').addEventListener('input',e=>{q=e.target.value;render()});\n$('#refresh').addEventListener('click',()=>{\n  const now=Date.now();\n  if(now-lastRefresh<2000){toast('Rate limited. Try again in a moment.','Error',true);return}\n  lastRefresh=now;\n  const b=$('#refresh');b.disabled=true;b.textContent='Refreshing…';\n  $('#queue-box').style.opacity='.4';\n  setTimeout(()=>{\n    b.disabled=false;b.textContent='Refresh';$('#queue-box').style.opacity='';\n    render();\n    toast('Queue up to date · '+counts().pending+' pending.','Synced');\n  },520);\n});\ndocument.addEventListener('keydown',e=>{\n  if($('#app').hidden)return;\n  const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);\n  if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus();return}\n  if(e.key==='Escape'&&typing){$('#q').value='';q='';render();document.activeElement.blur();return}\n  if(typing)return;\n  const map={'1':'pending','2':'approved','3':'rejected'};\n  if(map[e.key]){tab=map[e.key];render()}\n});\n\n/* ── boot ─────────────────────────────────────── */\n(function(){\n  const screen=new URLSearchParams(location.search).get('screen');\n  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}\n  if(screen==='signin'){showGate();return}\n  if(screen==='sent'){showGate();$('#gate-idle').hidden=true;$('#gate-sent').hidden=false;$('#sent-to').textContent='ana@194.club';return}\n  if(screen==='queue'||saved){\n    const who=saved||'ana@194.club';\n    $('#gate').hidden=true;$('#app').hidden=false;$('#officer-email').textContent=who;render();\n  }else showGate();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
