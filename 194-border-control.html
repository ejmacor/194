<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>194 — Border Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Sora:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1120;
    --ink-2: #0F172B;
    --ink-3: #141D33;
    --foil: #C8A55E;
    --foil-bright: #E3C888;
    --paper: #EDE8DC;
    --muted: #7C8699;
    --line: rgba(200,165,94,0.22);
    --approve: #4CAF7D;
    --reject: #C05B5B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Sora', sans-serif;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 36px;
  }
  .brand {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.35em;
    color: var(--foil);
  }
  .brand small {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-top: 4px;
  }
  .officer {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-align: right;
  }
  .officer b { color: var(--foil-bright); font-weight: 400; }
  .signout {
    display: block;
    margin-top: 6px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    background: none; border: none; cursor: pointer;
    padding: 0;
  }
  .signout:hover { color: var(--reject); }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 36px;
  }
  .stat {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    padding: 20px 22px;
  }
  .stat .num {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 30px;
    color: var(--foil-bright);
    line-height: 1.1;
  }
  .stat .lbl {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Tabs + search */
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 8px; }
  .tab {
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 2px;
    padding: 10px 18px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--paper); }
  .tab.active { color: var(--foil-bright); border-color: var(--line); background: var(--ink-2); }
  .tab .count {
    font-family: 'Share Tech Mono', monospace;
    margin-left: 6px;
    color: var(--foil);
  }
  .right-controls { display: flex; gap: 10px; align-items: center; }
  .search {
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    color: var(--paper);
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 11px 16px;
    width: 240px;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-color: var(--foil); outline: none; }
  :focus-visible { outline: 2px solid var(--foil-bright); outline-offset: 2px; }
  .refresh {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 11px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .refresh:hover { color: var(--foil-bright); border-color: var(--foil); }
  .refresh[disabled] { opacity: 0.5; cursor: default; }

  /* Queue */
  .queue { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 18px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    padding: 18px 20px;
    transition: opacity 0.3s, transform 0.3s;
  }
  .card.leaving { opacity: 0; transform: translateX(24px); }
  .flag {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--ink-3);
    border: 1px solid var(--line);
  }
  .who .name { font-weight: 500; font-size: 16px; color: var(--paper); }
  .who .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }
  .who .meta b { color: var(--foil); font-weight: 400; }
  .iglink {
    color: var(--foil-bright);
    text-decoration: none;
    border-bottom: 1px solid rgba(227,200,136,0.35);
    padding-bottom: 1px;
    transition: border-color 0.15s;
  }
  .iglink:hover { border-color: var(--foil-bright); }
  .who .sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: rgba(124,134,153,0.75);
    margin-top: 6px;
  }
  .actions { display: flex; gap: 10px; align-items: center; }
  .act {
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 2px;
    border: 1px solid;
    background: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .act[disabled] { opacity: 0.5; cursor: default; }
  .act.approve { color: var(--approve); border-color: rgba(76,175,125,0.45); }
  .act.approve:hover:not([disabled]) { background: var(--approve); color: var(--ink); }
  .act.reject { color: var(--reject); border-color: rgba(192,91,91,0.45); }
  .act.reject:hover:not([disabled]) { background: var(--reject); color: var(--ink); }
  .status-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1px solid;
    border-radius: 2px;
    transform: rotate(-2deg);
  }
  .status-pill.approved { color: var(--approve); border-color: rgba(76,175,125,0.5); }
  .status-pill.rejected { color: var(--reject); border-color: rgba(192,91,91,0.5); }
  .undo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    background: none; border: none;
    cursor: pointer;
    text-transform: uppercase;
  }
  .undo:hover { color: var(--foil-bright); }

  .empty {
    text-align: center;
    padding: 80px 20px;
    border: 1px dashed var(--line);
    border-radius: 4px;
  }
  .empty .big {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    letter-spacing: 0.2em;
    color: var(--foil);
    text-transform: uppercase;
  }
  .empty p { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* Toast */
  #toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 13px 22px;
    font-size: 13px;
    color: var(--paper);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 50;
    max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: rgba(192,91,91,0.6); color: #E58A7C; }

  /* ---------- Auth gate ---------- */
  #gate {
    position: fixed; inset: 0;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .gate-card {
    width: 100%; max-width: 400px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    padding: 42px 36px;
    text-align: center;
  }
  .gate-mark {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 0.08em;
    color: var(--foil);
  }
  .gate-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
  .gate-card form { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .gate-card input {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    color: var(--paper);
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 15px 16px;
    width: 100%;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .gate-card input:focus { border-color: var(--foil); outline: none; }
  #sent-panel { margin-top: 30px; }
  .sent-mark { font-size: 34px; color: var(--foil); }
  .sent-text { margin-top: 12px; font-size: 14px; color: var(--paper); }
  .sent-text b { color: var(--foil-bright); font-weight: 500; }
  .gate-btn {
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(160deg, var(--foil-bright), var(--foil));
    padding: 15px 20px;
    border: none; border-radius: 2px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .gate-btn:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(200,165,94,0.25); }
  .gate-btn[disabled] { opacity: 0.55; cursor: default; }
  .gate-msg {
    margin-top: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    min-height: 16px;
    color: var(--muted);
  }
  .gate-msg.err { color: #E58A7C; }
  .gate-back {
    margin-top: 14px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    background: none; border: none; cursor: pointer;
  }
  .gate-back:hover { color: var(--foil-bright); }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .card { grid-template-columns: 44px 1fr; }
    .actions { grid-column: 1 / -1; justify-content: flex-end; }
    .search { width: 100%; }
    .right-controls { width: 100%; }
  }
</style>
</head>
<body>

<!-- ---------- Auth gate ---------- -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-mark">194</div>
    <div class="gate-sub">Border Control &middot; Staff only</div>

    <!-- Step 1: request a magic link -->
    <form id="email-form">
      <input id="email" type="email" placeholder="Officer email" required autocomplete="email">
      <button class="gate-btn" type="submit" id="email-btn">Send sign-in link</button>
    </form>

    <!-- Step 2: link sent -->
    <div id="sent-panel" class="hidden">
      <div class="sent-mark">✉</div>
      <p class="sent-text" id="sent-text">Check your inbox and click the sign-in link to enter.</p>
      <button type="button" class="gate-back" id="sent-back">Use a different email</button>
    </div>

    <div class="gate-msg" id="gate-msg"></div>
  </div>
</div>

<!-- ---------- Dashboard ---------- -->
<div class="wrap hidden" id="app">

  <header>
    <div class="brand">194<small>Border Control</small></div>
    <div class="officer">Officer on duty<br><b id="officer-name">—</b>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Applications</div></div>
    <div class="stat"><div class="num" id="stat-pending">0</div><div class="lbl">In queue</div></div>
    <div class="stat"><div class="num" id="stat-rate">0%</div><div class="lbl">Approval rate</div></div>
    <div class="stat"><div class="num" id="stat-countries">0</div><div class="lbl">Countries</div></div>
  </div>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" data-tab="pending">Queue<span class="count" id="c-pending"></span></button>
      <button class="tab" data-tab="approved">Approved<span class="count" id="c-approved"></span></button>
      <button class="tab" data-tab="rejected">Rejected<span class="count" id="c-rejected"></span></button>
    </div>
    <div class="right-controls">
      <input class="search" id="search" type="text" placeholder="Search name, country, city…">
      <button class="refresh" id="refresh" title="Reload from Supabase">↻ Refresh</button>
    </div>
  </div>

  <div class="queue" id="queue"></div>

</div>

<div id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ---- Supabase config (anon key is public/client-safe; RLS + is_admin() enforce access) ----
  const SUPABASE_URL = 'https://eimjjrlhmykxfumwwbre.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpbWpqcmxobXlreGZ1bXd3YnJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjcxMDQsImV4cCI6MjA5ODg0MzEwNH0.7HlqZph8Tb_XYgp75s0VXfzpVfBmV-driJOQZYXWj0A';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- DOM ----------
  const gate = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const emailForm = document.getElementById('email-form');
  const sentPanel = document.getElementById('sent-panel');
  const emailInput = document.getElementById('email');
  const emailBtn = document.getElementById('email-btn');
  const gateMsg = document.getElementById('gate-msg');

  function setGateMsg(text, isErr) {
    gateMsg.textContent = text || '';
    gateMsg.classList.toggle('err', !!isErr);
  }

  let toastTimer;
  function toast(text, isErr) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  // Where the magic link should return the user. Must be listed under
  // Supabase → Authentication → URL Configuration → Redirect URLs.
  const REDIRECT_TO = window.location.origin + window.location.pathname;

  // ---------- Auth flow (email magic link) ----------
  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    if (!email) return;
    emailBtn.disabled = true;
    setGateMsg('Sending link…');
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: REDIRECT_TO }
    });
    emailBtn.disabled = false;
    if (error) { setGateMsg(error.message, true); return; }
    document.getElementById('sent-text').innerHTML =
      'Sign-in link sent to <b>' + esc(email) + '</b>. Click it to enter — you can close this tab.';
    emailForm.classList.add('hidden');
    sentPanel.classList.remove('hidden');
    setGateMsg('');
  });

  document.getElementById('sent-back').addEventListener('click', () => {
    sentPanel.classList.add('hidden');
    emailForm.classList.remove('hidden');
    setGateMsg('');
    emailInput.focus();
  });

  // Surface auth errors handed back in the URL (e.g. expired/used link).
  (function reportUrlAuthError() {
    const hash = window.location.hash || '';
    const m = /error_description=([^&]+)/.exec(hash);
    if (m) {
      setGateMsg(decodeURIComponent(m[1].replace(/\+/g, ' ')), true);
      history.replaceState(null, '', window.location.pathname);
    }
  })();

  document.getElementById('signout').addEventListener('click', async () => {
    await supabase.auth.signOut();
  });

  // React to session changes (login, logout, token refresh, initial load).
  supabase.auth.onAuthStateChange(async (_event, session) => {
    if (session) {
      await enterDashboard(session);
    } else {
      showGate();
    }
  });

  function showGate() {
    appEl.classList.add('hidden');
    gate.classList.remove('hidden');
    sentPanel.classList.add('hidden');
    emailForm.classList.remove('hidden');
    emailInput.value = '';
  }

  async function enterDashboard(session) {
    // Authorization: verified server-side by is_admin() (RLS also blocks data for non-admins).
    const { data: isAdmin, error } = await supabase.rpc('is_admin');
    if (error) { setGateMsg('Could not verify access: ' + error.message, true); return; }
    if (!isAdmin) {
      setGateMsg('This account is not authorized for Border Control.', true);
      await supabase.auth.signOut();
      return;
    }
    currentUserId = session.user.id;
    document.getElementById('officer-name').textContent = (session.user.email || '').toUpperCase();
    gate.classList.add('hidden');
    appEl.classList.remove('hidden');
    await loadApps();
  }

  // ---------- Data ----------
  let apps = [];
  let currentUserId = null;
  let currentTab = 'pending';
  let query = '';

  async function loadApps() {
    const refreshBtn = document.getElementById('refresh');
    refreshBtn.disabled = true;
    const { data, error } = await supabase
      .from('applications')
      .select('*')
      .order('created_at', { ascending: false });
    refreshBtn.disabled = false;
    if (error) { toast('Failed to load applications: ' + error.message, true); return; }
    apps = data || [];
    render();
  }

  document.getElementById('refresh').addEventListener('click', () => {
    loadApps().then(() => toast('Reloaded.'));
  });

  // ---------- Rendering ----------
  function counts() {
    const c = { pending: 0, approved: 0, rejected: 0 };
    apps.forEach((a) => { if (c[a.status] !== undefined) c[a.status]++; });
    return c;
  }

  function renderStats() {
    const c = counts();
    const decided = c.approved + c.rejected;
    const rate = decided ? Math.round((c.approved / decided) * 100) : 0;
    const countries = {};
    apps.forEach((a) => { if (a.country) countries[a.country.trim().toLowerCase()] = 1; });
    document.getElementById('stat-total').textContent = apps.length;
    document.getElementById('stat-pending').textContent = c.pending;
    document.getElementById('stat-rate').textContent = rate + '%';
    document.getElementById('stat-countries').textContent = Object.keys(countries).length;
    document.getElementById('c-pending').textContent = c.pending;
    document.getElementById('c-approved').textContent = c.approved;
    document.getElementById('c-rejected').textContent = c.rejected;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ));
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  function igUrl(handle) {
    return 'https://instagram.com/' + String(handle || '').replace(/^@+/, '').trim();
  }

  function cardHTML(a) {
    const flag = countryFlag(a.country);
    const igRaw = String(a.instagram || '').replace(/^@+/, '').trim();
    const ig = igRaw
      ? '<a class="iglink" href="' + esc(igUrl(igRaw)) + '" target="_blank" rel="noopener noreferrer">@' + esc(igRaw) + ' ↗</a>'
      : '<span style="color:var(--muted)">no instagram</span>';

    let right;
    if (a.status === 'pending') {
      right = '<div class="actions">' +
        '<button class="act approve" data-id="' + esc(a.id) + '" data-decide="approved">Approve</button>' +
        '<button class="act reject" data-id="' + esc(a.id) + '" data-decide="rejected">Reject</button>' +
        '</div>';
    } else {
      right = '<div class="actions">' +
        '<span class="status-pill ' + esc(a.status) + '">' + esc(a.status) + '</span>' +
        '<button class="undo" data-id="' + esc(a.id) + '" data-decide="pending">Undo</button>' +
        '</div>';
    }

    const cityCountry = [a.country, a.city].filter(Boolean).map(esc);
    const metaLine = (a.country ? '<b>' + esc(a.country) + '</b>' : '') +
      (a.city ? ' &middot; ' + esc(a.city) : '') + ' &middot; ' + ig;

    return '<div class="card" id="card-' + esc(a.id) + '">' +
      '<div class="flag">' + flag + '</div>' +
      '<div class="who">' +
        '<div class="name">' + esc(a.name || 'Unknown') + '</div>' +
        '<div class="meta">' + metaLine + '</div>' +
        '<div class="sub">' + esc(a.email || '') + ' &middot; APPLIED ' + esc(fmtDate(a.created_at).toUpperCase()) + '</div>' +
      '</div>' + right + '</div>';
  }

  function render() {
    renderStats();
    const q = query.toLowerCase();
    const list = apps.filter((a) => {
      if (a.status !== currentTab) return false;
      if (!q) return true;
      return ((a.name || '') + ' ' + (a.country || '') + ' ' + (a.city || '')).toLowerCase().indexOf(q) !== -1;
    });
    const el = document.getElementById('queue');
    if (!list.length) {
      const msg = currentTab === 'pending' ? 'Queue clear' : 'Nothing here';
      const sub = currentTab === 'pending'
        ? 'Every application has been processed. The border rests.'
        : 'No ' + currentTab + ' applications' + (q ? ' matching your search.' : '.');
      el.innerHTML = '<div class="empty"><div class="big">' + msg + '</div><p>' + esc(sub) + '</p></div>';
      return;
    }
    el.innerHTML = list.map(cardHTML).join('');
  }

  // ---------- Decisions (writes to Supabase) ----------
  async function decide(id, status) {
    const row = apps.find((a) => String(a.id) === String(id));
    if (!row) return;
    const prevStatus = row.status;

    const card = document.getElementById('card-' + id);
    if (card && status !== 'pending') card.classList.add('leaving');

    // Disable this card's buttons to prevent double-submits.
    if (card) card.querySelectorAll('button').forEach((b) => (b.disabled = true));

    const patch = status === 'pending'
      ? { status: 'pending', decided_at: null, decided_by: null }
      : { status: status, decided_at: new Date().toISOString(), decided_by: currentUserId };

    const { error } = await supabase.from('applications').update(patch).eq('id', id);

    if (error) {
      if (card) {
        card.classList.remove('leaving');
        card.querySelectorAll('button').forEach((b) => (b.disabled = false));
      }
      toast('Update failed: ' + error.message, true);
      return;
    }

    // Apply locally and re-render (keep the animation feel from the prototype).
    row.status = patch.status;
    row.decided_at = patch.decided_at;
    row.decided_by = patch.decided_by;
    const commit = () => {
      render();
      if (status === 'approved') toast('Approved — cleared for entry.');
      else if (status === 'rejected') toast('Rejected — sent to waitlist.');
      else toast('Reverted to queue.');
    };
    if (card && status !== 'pending') setTimeout(commit, 280);
    else commit();

    // Fire the decision email (approve/reject only). Non-blocking: a mail
    // failure doesn't undo the decision, but we warn the officer.
    if (status === 'approved' || status === 'rejected') {
      supabase.functions
        .invoke('send-decision-email', { body: { application_id: id, decision: status } })
        .then(({ error: mailErr }) => {
          if (mailErr) toast('Decision saved, but the email failed to send.', true);
        })
        .catch(() => toast('Decision saved, but the email failed to send.', true));
    }
  }

  // Event delegation for approve/reject/undo buttons.
  document.getElementById('queue').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-decide]');
    if (!btn || btn.disabled) return;
    decide(btn.getAttribute('data-id'), btn.getAttribute('data-decide'));
  });

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      currentTab = t.getAttribute('data-tab');
      render();
    });
  });

  document.getElementById('search').addEventListener('input', (e) => {
    query = e.target.value;
    render();
  });
